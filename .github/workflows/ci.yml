name: CI

# leerness CI — runs the full integrity gate (version + selftest + e2e) on every push/PR.
# Public CI result raises trust: the e2e badge in README reflects this workflow.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast:
    name: fast (${{ matrix.os }}, selftest + smoke)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      # Bounded quick feedback — full e2e runs in the `test` matrix below.
      - name: test:fast
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:fast

  test:
    name: gate (selftest + e2e)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        # DEP0190 becomes a runtime warning on Node 24. Keep the compatibility
        # matrix and add one full Windows E2E job where the warning gate is live.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # No dependencies to install (zero runtime deps) — run the integrity gate directly.
      - name: version
        run: node ./bin/leerness.js --version
      - name: selftest
        run: node ./bin/leerness.js selftest
      - name: release runtime (shell-free npm)
        run: node ./scripts/release-runtime-probe.js
      # 1.36.127 (T-0105): 이 중간 티어(42블록·66초)는 만들어 놓고 **아무도 부르지 않았다**.
      #   우리 고아 가드 탐지기가 0건이라 한 것은 bin/leerness.js 안의 문자열에 가려졌기 때문이다.
      #   사람이 기억해야만 도는 가드는 결국 안 돈다 — 여기와 npm test 양쪽에 배선한다.
      - name: e2e-core
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/e2e-core.js
      # File-mutating commands share one compare-and-set boundary. Keep this
      # probe explicit in the full OS/Node matrix so package-script refactors
      # cannot silently orphan the data-integrity regression suite.
      - name: mutation-integrity
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/mutation-integrity-probe.js
      - name: e2e-command-surface
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:commands
      - name: e2e-handoff-enforcement
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:handoff
      - name: e2e
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/e2e.js

  release-runtime:
    name: release runtime (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: release runtime (shell-free npm)
        run: node ./scripts/release-runtime-probe.js
