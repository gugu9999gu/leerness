name: CI










on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'gugu9999gu/leerness'
    name: gate e2e (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        
        
        include:
          - { os: windows-latest, node: 18, shard: 1, shards: 4 }
          - { os: windows-latest, node: 18, shard: 2, shards: 4 }
          - { os: windows-latest, node: 18, shard: 3, shards: 4 }
          - { os: windows-latest, node: 18, shard: 4, shards: 4 }
          - { os: windows-latest, node: 20, shard: 1, shards: 4 }
          - { os: windows-latest, node: 20, shard: 2, shards: 4 }
          - { os: windows-latest, node: 20, shard: 3, shards: 4 }
          - { os: windows-latest, node: 20, shard: 4, shards: 4 }
          - { os: windows-latest, node: 22, shard: 1, shards: 4 }
          - { os: windows-latest, node: 22, shard: 2, shards: 4 }
          - { os: windows-latest, node: 22, shard: 3, shards: 4 }
          - { os: windows-latest, node: 22, shard: 4, shards: 4 }
          - { os: windows-latest, node: 24, shard: 1, shards: 4 }
          - { os: windows-latest, node: 24, shard: 2, shards: 4 }
          - { os: windows-latest, node: 24, shard: 3, shards: 4 }
          - { os: windows-latest, node: 24, shard: 4, shards: 4 }
          - { os: ubuntu-latest, node: 18, shard: 1, shards: 2 }
          - { os: ubuntu-latest, node: 18, shard: 2, shards: 2 }
          - { os: ubuntu-latest, node: 20, shard: 1, shards: 2 }
          - { os: ubuntu-latest, node: 20, shard: 2, shards: 2 }
          - { os: ubuntu-latest, node: 22, shard: 1, shards: 2 }
          - { os: ubuntu-latest, node: 22, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      
      
      - name: e2e
        env:
          LEERNESS_OFFLINE: "1"
          LEERNESS_E2E_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: node ./scripts/e2e.js

  commands:
    if: github.repository == 'gugu9999gu/leerness'
    name: gate commands (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 18, shard: 1, shards: 2 }
          - { os: windows-latest, node: 18, shard: 2, shards: 2 }
          - { os: windows-latest, node: 20, shard: 1, shards: 2 }
          - { os: windows-latest, node: 20, shard: 2, shards: 2 }
          - { os: windows-latest, node: 22, shard: 1, shards: 2 }
          - { os: windows-latest, node: 22, shard: 2, shards: 2 }
          - { os: windows-latest, node: 24, shard: 1, shards: 2 }
          - { os: windows-latest, node: 24, shard: 2, shards: 2 }
          - { os: ubuntu-latest, node: 18, shard: 1, shards: 1 }
          - { os: ubuntu-latest, node: 20, shard: 1, shards: 1 }
          - { os: ubuntu-latest, node: 22, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: e2e-command-surface
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/ci-shard.js npm test:commands ${{ matrix.shard }}/${{ matrix.shards }}

  fast:
    if: github.repository == 'gugu9999gu/leerness'
    name: fast (${{ matrix.os }}, selftest + smoke, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
          - { os: windows-latest, shard: 3, shards: 3 }
          - { os: ubuntu-latest, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      
      - name: E2E observation controls
        if: matrix.shard == 1
        run: npm run test:e2e-observation
      - name: test:fast
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/ci-shard.js npm test:fast ${{ matrix.shard }}/${{ matrix.shards }}

  core:
    if: github.repository == 'gugu9999gu/leerness'
    name: gate core (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 18 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 22 }
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      
      - name: version
        run: node ./bin/leerness.js --version
      - name: selftest
        run: node ./bin/leerness.js selftest
      - name: state scopes (read-only topology and CLI)
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:state-scopes
      - name: runtime compatibility (reader, writer admission, diagnostics)
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:runtime-compatibility
      - name: Windows encoding replacement controls
        if: runner.os == 'Windows'
        run: node ./scripts/encoding-selftest-probe.js --real-controls
      - name: release runtime (shell-free npm)
        run: node ./scripts/release-runtime-probe.js
      
      
      
      - name: e2e-core
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/e2e-core.js
      
      
      
      - name: mutation-integrity
        env:
          LEERNESS_OFFLINE: "1"
        run: node ./scripts/mutation-integrity-probe.js
      - name: e2e-handoff-enforcement
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:handoff

  installed:
    if: github.repository == 'gugu9999gu/leerness'
    name: installed package (${{ matrix.os }}, node 20)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      
      - name: installed cleanroom
        env:
          LEERNESS_OFFLINE: "1"
        run: npm run test:installed

  release-runtime:
    if: github.repository == 'gugu9999gu/leerness'
    name: release runtime (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: release runtime (shell-free npm)
        run: node ./scripts/release-runtime-probe.js
